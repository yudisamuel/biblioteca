<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca</title>

    <!-- Ligação com o CSS -->
    <link rel="stylesheet" href="css/biblioteca.css">
</head>

<body>

    <header>
        <h1>📚 Biblioteca</h1>
        <p>Controle de empréstimos de livros</p>
    </header>

    <main>

        <section>
            <h2>Registrar Empréstimo</h2>

            <form id="form">

                <label>Nome completo:</label>
                <input 
                    type="text"
                    required
                    minlength="3"
                    pattern="[A-Za-zÀ-ÿ ]+"
                    title="Digite apenas letras e espaços">

                <label>E-mail:</label>
                <input 
                    type="email"
                    required
                    placeholder="exemplo@email.com">

                <label>CPF:</label>
                <input 
                    type="text"
                    required
                    minlength="11"
                    maxlength="11"
                    pattern="[0-9]{11}"
                    title="Digite exatamente 11 números">

                <label>Livro:</label>

                <select required>
                    <option value="">Selecione um livro</option>
                    <option>Dom Casmurro</option>
                    <option>O Pequeno Príncipe</option>
                    <option>Harry Potter</option>
                    <option>Muito Barulho por Nada</option>
                </select>

                <label>Data de devolução:</label>

                <input 
                    type="date"
                    required>

                <button type="submit">
                    Registrar empréstimo
                </button>

            </form>

            <p id="mensagem"></p>
        </section>


        <section>

            <h2>📖 Livros disponíveis</h2>

            <div class="livro">
                <b>Dom Casmurro</b>
                <p>Machado de Assis</p>
            </div>

            <div class="livro">
                <b>O Pequeno Príncipe</b>
                <p>Antoine de Saint-Exupéry</p>
            </div>

            <div class="livro">
                <b>Harry Potter</b>
                <p>J. K. Rowling</p>
            </div>

            <div class="livro">
                <b>Muito Barulho por Nada</b>
                <p>William Shakespeare</p>
            </div>

        </section>

    </main>

    <!-- Ligação com o JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
